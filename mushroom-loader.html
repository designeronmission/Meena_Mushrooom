<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meena Mushroom Loader</title>
    <style>
        :root {
            --bg-color: #111612;       /* Deep earthy forest black */
            --accent-gold: #c5a880;   /* Muted luxury gold */
            --shroom-white: #f4efe6;  /* Soft organic cream */
            --text-muted: #707a72;    /* Elegant sage gray */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 400px;
            height: 220px;
        }

        /* Animation Stage Area */
        .stage {
            position: relative;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 24px;
        }

        /* --- THE MUSHROOM --- */
        .mushroom {
            position: absolute;
            bottom: 32px; /* Slightly adjusted to seat inside the basket */
            left: calc(50% - 30px);
            width: 60px;
            height: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            z-index: 3;
            animation: shroomLoop 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        .cap {
            width: 54px;
            height: 32px;
            background: var(--shroom-white);
            border-radius: 40px 40px 10px 10px;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .cap::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: var(--accent-gold);
            border-radius: 2px;
            opacity: 0.5;
        }

        .stem {
            width: 16px;
            height: 28px;
            background: linear-gradient(to bottom, var(--shroom-white) 70%, #e0d9cb 100%);
            border-radius: 0 0 6px 6px;
            margin-top: -2px;
        }

        /* --- THE MARKET TROLLEY / BAG --- */
        .cart-container {
            position: absolute;
            bottom: 0px;
            left: 50%;
            width: 90px;
            height: 65px;
            transform: translateX(-50%);
            z-index: 2;
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            animation: cartLoop 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        /* Elegant Tapered Trolley Basket Frame */
        .cart-body {
            width: 84px;
            height: 44px;
            background: rgba(197, 168, 128, 0.08);
            border: 1.5px solid var(--accent-gold);
            border-radius: 4px 4px 16px 16px; /* Bag/basket curves */
            position: relative;
            overflow: hidden;
        }

        /* Luxury Woven Basket Patch Texture */
        .cart-body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(90deg, rgba(197, 168, 128, 0.15) 1px, transparent 1px),
                              linear-gradient(0deg, rgba(197, 168, 128, 0.15) 1px, transparent 1px);
            background-size: 8px 6px;
        }

        /* Curved Trolley Handle Bar */
        .cart-handle {
            position: absolute;
            left: -12px;
            top: 8px;
            width: 16px;
            height: 24px;
            border: 1.5px solid var(--accent-gold);
            border-right: none;
            border-radius: 12px 0 0 12px;
            transform-origin: right center;
        }
        
        .cart-handle::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 6px;
            height: 6px;
            background: var(--shroom-white);
            border-radius: 50%;
        }

        /* Spoked Trolley Wheels */
        .wheels {
            display: flex;
            justify-content: space-between;
            width: 60px;
            margin-top: -3px;
            z-index: 4;
        }

        .wheel {
            width: 14px;
            height: 14px;
            background: var(--bg-color);
            border: 1.5px solid var(--accent-gold);
            border-radius: 50%;
            position: relative;
            animation: wheelSpin 4s linear infinite;
        }

        /* Elegant inner wire spoke accent */
        .wheel::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1.5px;
            background: rgba(197, 168, 128, 0.4);
            transform: translateY(-50%);
        }

        /* --- ENVIRONMENT / SPEED TRAILS --- */
        .dispatch-lines {
            position: absolute;
            left: 10%;
            bottom: 25px;
            width: 80% ;
            height: 30px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            animation: linesLoop 4s ease-in-out infinite;
        }

        .line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            height: 1px;
            border-radius: 5px;
            opacity: 0.5;
        }

        .line-1 { width: 80px; top: 5px; right: 0; }
        .line-2 { width: 50px; top: 15px; right: 20px; }
        .line-3 { width: 65px; top: 25px; right: 10px; }

        /* Elegant Dynamic Text */
        .status-text {
            color: var(--shroom-white);
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 400;
            height: 20px;
            text-align: center;
            opacity: 0.8;
        }

        /* Progress Bar Base */
        .progress-track {
            width: 140px;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: var(--accent-gold);
            transform: translateX(-100%);
            animation: progressLoop 4s linear infinite;
        }

        /* --- TIMELINE ANIMATION (4s Loop) --- */
        
        @keyframes shroomLoop {
            /* 0% - 30%: Sprout and grow at center stage */
            0% { transform: scale(0); opacity: 0; }
            8% { transform: scale(1.1); opacity: 1; }
            12% { transform: scale(1); }
            
            /* 30% - 40%: Crouch down preparing to hop into the trolley basket */
            32% { transform: scale(1.1, 0.85) translateY(0); }
            38% { transform: scale(0.9, 1.15) translateY(-32px); opacity: 1; }
            
            /* 40% - 62%: Drop cleanly inside the basket bag */
            43%, 62% { transform: scale(0.85) translateY(12px); opacity: 0.9; }
            
            /* 62%+: Dispatches away flawlessly seated inside the trolley */
            72% { transform: scale(0.8) translate(180px, 12px) skewX(-12deg); opacity: 0; }
            73%, 100% { transform: scale(0) translate(0, 0); opacity: 0; }
        }

        @keyframes cartLoop {
            /* Arrival */
            0%, 28% { transform: translate(-180px, 0) rotate(-5deg); opacity: 0; }
            
            /* Pauses perfectly for package collection */
            38%, 62% { transform: translate(-50%, 0) rotate(0deg); opacity: 1; }
            
            /* High speed acceleration outward to the right with dynamic cart lean */
            72% { transform: translate(180px, 0) skewX(-8deg) rotate(3deg); opacity: 0; }
            76%, 100% { transform: translate(-180px, 0); opacity: 0; }
        }

        @keyframes wheelSpin {
            0%, 28% { transform: rotate(0deg); }
            38%, 62% { transform: rotate(360deg); }
            72% { transform: rotate(1260deg); }
            100% { transform: rotate(1260deg); }
        }

        @keyframes linesLoop {
            0%, 58% { opacity: 0; transform: translateX(40px); }
            62% { opacity: 1; }
            70% { opacity: 0; transform: translateX(-120px); }
            100% { opacity: 0; }
        }

        @keyframes progressLoop {
            0% { transform: translateX(-100%); }
            38% { transform: translateX(-40%); }
            62% { transform: translateX(-10%); }
            72% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="stage">
            <!-- Environment Speed Trails -->
            <div class="dispatch-lines">
                <div class="line line-1"></div>
                <div class="line line-2"></div>
                <div class="line line-3"></div>
            </div>
            
            <!-- Premium Geometric Mushroom -->
            <div class="mushroom">
                <div class="cap"></div>
                <div class="stem"></div>
            </div>

            <!-- Handcrafted Market Trolley Bag -->
            <div class="cart-container">
                <div class="cart-handle"></div>
                <div class="cart-body"></div>
                <div class="wheels">
                    <div class="wheel"></div>
                    <div class="wheel"></div>
                </div>
            </div>
        </div>

        <!-- Dynamic Status Display -->
        <div class="status-text" id="loading-text">Cultivating</div>

        <!-- Sleek Timing Track -->
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        const textElement = document.getElementById('loading-text');
        
        const phases = [
            { text: "Cultivating", time: 0 },
            { text: "Quality Check", time: 1100 },
            { text: "Packing Basket", time: 1500 },
            { text: "Dispatching", time: 2400 },
            { text: "In Transit", time: 2900 }
        ];

        function runTextPipeline() {
            phases.forEach(phase => {
                setTimeout(() => {
                    textElement.innerText = phase.text;
                }, phase.time);
            });
        }

        runTextPipeline();
        setInterval(runTextPipeline, 4000);
    </script>
</body>
</html>
