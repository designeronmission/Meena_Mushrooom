<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meena Mushroom | Quantum Launch Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Orbitron:500,700,900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #020408;
        }

        .logo-corn {
            width: 230px;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3));
        }

        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #051404;
            perspective: 1000px;
        }

        .scene-container::before {
            content: '';
            position: absolute;
            bottom: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 550px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(6, 78, 59, 0.05) 50%, rgba(0, 0, 0, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .ui-grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(16, 185, 129, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 2;
        }

        #portalFlash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #5E8B2A 30%, #064e3b 60%, #020408 100%);
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* ========== HUD LAYOUT ========== */
        .controls-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 35px 60px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: auto 1fr;
            align-items: start;
            z-index: 50;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .header-logo-panel {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
        }

        .logo-placeholder {
            padding-left: 15px;
        }

        .header-timer-panel {
            grid-column: 2;
            grid-row: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px 30px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            max-width: 850px;
            margin: 0 auto;
            transform: translateY(10px);
        }

        .premium-countdown-hud {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 55px;
            flex-wrap: wrap;
        }

        .hud-time-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(4, 12, 22, 0.9) 100%);
            border: 1px solid rgba(94, 139, 42, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(16, 185, 129, 0.05);
            min-width: 100px;
            padding: 14px 10px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .hud-time-segment::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #9ACB4D, transparent);
        }

        .hud-digit-slot {
            font-family: 'Orbitron', monospace;
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 30%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .hud-digit-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .hud-time-separator {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 700;
            color: #5E8B2A;
            opacity: 0.8;
            animation: pulse 1s infinite alternate;
            padding-bottom: 20px;
        }

        .solo-countdown {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        .solo-digit-card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(4, 12, 22, 1) 100%);
            border: 2px solid rgba(94, 139, 42, 0.6);
            border-radius: 24px;
            padding: 20px 40px;
            box-shadow: 0 0 30px rgba(16,185,129,0.2);
        }
        .solo-digit {
            font-family: 'Orbitron', monospace;
            font-size: 90px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #9ACB4D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #9ACB4D;
        }
        .solo-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #9ACB4D;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .url-highlight {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            font-size: 15px;
            position: relative;
            top: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(94, 139, 42, 0.2);
            padding-bottom: 5px;
            display: inline-block;
        }

        .header-action-panel {
            grid-column: 3;
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-top: 10px;
        }

        .cyber-matrix-card {
            background: linear-gradient(135deg, rgba(6, 24, 16, 0.85) 0%, rgba(2, 6, 12, 0.95) 100%);
            border-left: 4px solid #9ACB4D;
            border-top: 1px solid rgba(94, 139, 42, 0.4);
            border-right: 1px solid rgba(94, 139, 42, 0.2);
            border-bottom: 1px solid rgba(94, 139, 42, 0.2);
            padding: 18px 24px;
            border-radius: 4px 16px 16px 4px;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(16, 185, 129, 0.05);
            position: relative;
            overflow: hidden;
            min-width: 270px;
        }

        .cyber-matrix-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #9ACB4D, transparent);
            animation: pulse 2s infinite alternate;
        }

        .matrix-common-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: #64748b;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(94, 139, 42, 0.2);
            padding-bottom: 6px;
        }

        .matrix-node {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .venue-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            color: #9ACB4D;
            filter: drop-shadow(0 0 4px rgba(154, 203, 77, 0.4));
            flex-shrink: 0;
        }

        .venue-icon-box svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .matrix-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .matrix-value span { color: #9ACB4D; }

        .bottom-action-row {
            grid-column: 1 / span 3;
            grid-row: 2;
            align-self: flex-end;
            display: flex;
            justify-content: flex-end;
            width: 100%;
            padding-bottom: 40px;
        }

        .mushroom-switch-console {
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border: 2px solid rgba(94, 139, 42, 0.4);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 4px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 160px;
            position: relative;
        }

        .mushroom-well-plate {
            position: relative;
            width: 80px;
            height: 100px;
            background: #090d16;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 300px;
        }

        .mushroom-lever-stem {
            position: relative;
            width: 14px;
            height: 55px;
            background: linear-gradient(90deg, #334155 0%, #64748b 50%, #1e293b 100%);
            border-radius: 4px;
            transform-origin: 50% 90%;
            transform: rotateX(25deg);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            z-index: 5;
        }

        .mushroom-lever-stem::before {
            content: '';
            position: absolute;
            top: -16px;
            left: -21px;
            width: 56px;
            height: 32px;
            background: linear-gradient(180deg, #9ACB4D 0%, #5E8B2A 100%);
            border-radius: 30px 30px 10px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px rgba(154, 203, 77, 0.6);
        }

        .mushroom-lever-stem::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -6px;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 18px -2px 0 #fff, 8px 6px 0 #fff, 24px 8px 0 #fff, 2px 10px 0 #fff;
            opacity: 0.8;
        }

        .mushroom-glass-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16,185,129,0.08);
            border: 2px dashed rgba(154,203,77,0.4);
            border-radius: 10px;
            transform-origin: 50% 0%;
            transform: rotateX(0deg);
            transition: transform 0.4s ease;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
        }

        .mushroom-glass-cover::after { content: 'ARMED'; font-family: 'Orbitron'; font-size: 8px; color: #9ACB4D; letter-spacing: 1px; animation: pulse 1s infinite alternate; }
        .mushroom-switch-console:hover .mushroom-glass-cover { transform: rotateX(-110deg); }
        .mushroom-switch-console.flipped .mushroom-lever-stem { transform: rotateX(-35deg); }
        .console-label { font-family: 'Orbitron', sans-serif; font-size: 9px; color: #64748b; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }

        .secure-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2,4,8,0.85);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .secure-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .secure-modal-box {
            background: rgba(4,12,22,0.75);
            border: 1px solid rgb(94 139 42);
            box-shadow: 0 0 50px rgba(16,185,129,0.15);
            padding: 40px;
            border-radius: 16px;
            max-width: 480px;
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.25,1,0.5,1);
        }
        .secure-modal-overlay.active .secure-modal-box { transform: scale(1) translateY(0); }
        .modal-headline { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 20px; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
        .modal-body-text { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .passcode-wrapper { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .passcode-digit {
            width: 55px;
            height: 65px;
            background: rgba(15,23,42,0.6);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 8px;
            font-family: 'Orbitron';
            font-size: 28px;
            font-weight: 700;
            color: #5E8B2A;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
        }
        .passcode-digit::-webkit-outer-spin-button,
        .passcode-digit::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .passcode-digit:focus { border-color: #5E8B2A; box-shadow: 0 0 15px rgba(16,185,129,0.4); }
        .error-message { color: #ef4444; font-family: 'Orbitron'; font-size: 11px; letter-spacing: 1px; opacity: 0; height: 15px; margin-bottom: 20px; }
        .modal-action-btn { width: 100%; background: rgba(16,185,129,0.1); border: 1px solid #5E8B2A; color: #5E8B2A; font-family: 'Orbitron'; font-size: 13px; font-weight: 700; padding: 16px; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; }
        .modal-action-btn:hover { background: #9ACB4D; color: #020408; box-shadow: 0 0 25px #9ACB4D; }

        .vector-stage-anchor {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 480px;
            z-index: 20;
            will-change: transform, bottom;
        }
        svg { display: block; width: 100%; height: 100%; }
        .brand-gold { fill: #eab308; }
        .brand-emerald { fill: #5E8B2A; }
        .hull-dark { fill: #1e293b; }
        .hull-light { fill: #f8fafc; }
        .hull-shadow { fill: #e2e8f0; }
        .hull-deep { fill: #0f172a; }
        .glow-accent { fill: #5E8B2A; opacity: 0.9; }
        .thruster-metallic { fill: #64748b; }

        #smokeCanvas, #spaceCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #spaceCanvas { z-index: 0; }
        #smokeCanvas { z-index: 15; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>

<body>
<div class="scene-container" id="scene">
    <canvas id="spaceCanvas"></canvas>
    <div class="ui-grid-overlay"></div>
    <div id="portalFlash"></div>

    <div class="secure-modal-overlay" id="secureOverrideModal">
        <div class="secure-modal-box">
            <h3 class="modal-headline"><span>⚠️</span> Secure Ignition</h3>
            <p class="modal-body-text">Enter secure passcode to override timer & initiate early launch.<br><strong>(Code: 1234)</strong></p>
            <div class="passcode-wrapper">
                <input type="number" class="passcode-digit" maxlength="1" oninput="stepPasscodeInput(this,0)">
                <input type="number" class="passcode-digit" maxlength="1" oninput="stepPasscodeInput(this,1)">
                <input type="number" class="passcode-digit" maxlength="1" oninput="stepPasscodeInput(this,2)">
                <input type="number" class="passcode-digit" maxlength="1" oninput="stepPasscodeInput(this,3)">
            </div>
            <div class="error-message" id="errorMessage">Invalid Passcode</div>
            <button class="modal-action-btn" onclick="verifyOverrideSequence()">Engage Ignition</button>
        </div>
    </div>

    <div class="controls-layer" id="controlsUI">
        <div class="header-logo-panel"><div class="logo-placeholder"><img src="logo-white.png" class="logo-corn" alt="Logo" onerror="this.style.display='none'"></div></div>
        <div class="header-timer-panel">
            <div class="launch-details-content">
                <div class="url-highlight">We are excited to announce the launch of our official website</div>
                <div id="standardHUD" class="premium-countdown-hud">
                    <div class="hud-time-segment"><div class="hud-digit-slot" id="hud-days">00</div><div class="hud-digit-label">Days</div></div>
                    <div class="hud-time-separator">:</div>
                    <div class="hud-time-segment"><div class="hud-digit-slot" id="hud-hours">00</div><div class="hud-digit-label">Hours</div></div>
                    <div class="hud-time-separator">:</div>
                    <div class="hud-time-segment"><div class="hud-digit-slot" id="hud-mins">00</div><div class="hud-digit-label">Mins</div></div>
                    <div class="hud-time-separator">:</div>
                    <div class="hud-time-segment"><div class="hud-digit-slot" id="hud-secs">00</div><div class="hud-digit-label">Secs</div></div>
                </div>
                <div id="soloCountdownContainer" style="display: none;" class="solo-countdown">
                    <div class="solo-digit-card">
                        <div class="solo-digit" id="soloSeconds">10</div>
                        <div class="solo-label">SECONDS TO IGNITION</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-action-panel">
            <div class="cyber-matrix-card">
                <div class="matrix-common-header">Launch On</div>
                <div class="matrix-node"><div class="venue-icon-box"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg></div><div class="matrix-value">31 May <span>2026</span></div></div>
                <div class="matrix-node"><div class="venue-icon-box"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div><div class="matrix-value">11:11 <span>AM</span></div></div>
            </div>
        </div>
        <div class="bottom-action-row">
            <div class="mushroom-switch-console" id="switchConsole">
                <div class="mushroom-well-plate">
                    <div class="mushroom-lever-stem" id="launchTriggerBtn" onclick="toggleLeverTriggered()"></div>
                    <div class="mushroom-glass-cover"></div>
                </div>
                <span class="console-label">Launch</span>
            </div>
        </div>
    </div>

    <div class="vector-stage-anchor" id="stageAnchor">
        <svg viewBox="0 0 400 600">
            <g id="LaunchPad"><path class="hull-deep" d="M120,560 L280,560 L300,590 L100,590 Z" /><rect x="140" y="550" width="120" height="10" class="thruster-metallic" rx="3" /><line x1="100" y1="590" x2="300" y2="590" style="stroke:#5E8B2A; stroke-width:2; opacity:0.3;" /></g>
            <g id="rocket-image">
                <path class="hull-dark" d="M145,360 C110,390 100,480 115,530 C125,500 140,480 145,430 Z" /><path class="brand-emerald" d="M115,450 C105,480 110,510 115,530 C120,510 125,490 122,450 Z" /><path class="brand-gold" d="M138,400 C125,430 125,470 132,500 C135,470 140,440 138,400 Z" />
                <path class="hull-dark" d="M255,360 C290,390 300,480 285,530 C275,500 260,480 255,430 Z" /><path class="brand-emerald" d="M285,450 C295,480 290,510 285,530 C280,510 275,490 278,450 Z" /><path class="brand-gold" d="M262,400 C275,430 275,470 268,500 C265,470 260,440 262,400 Z" />
                <path class="thruster-metallic" d="M160,510 L240,510 L245,540 L155,540 Z" /><rect x="170" y="540" width="20" height="12" class="hull-deep" rx="2" /><rect x="210" y="540" width="20" height="12" class="hull-deep" rx="2" /><rect x="165" y="520" width="70" height="6" class="brand-emerald" />
                <path class="hull-light" d="M150,240 C150,240 140,360 145,510 L255,510 C260,360 250,240 250,240 Z" /><path class="hull-shadow" d="M200,240 C200,240 250,240 250,240 C250,240 260,360 255,510 L200,510 Z" />
                <circle cx="200" cy="310" r="22" class="hull-dark" /><circle cx="200" cy="310" r="17" class="brand-emerald" /><circle cx="194" cy="304" r="14" class="glow-accent" /><circle cx="191" cy="299" r="4" class="hull-light" opacity="0.7" />
                <circle cx="200" cy="390" r="16" class="hull-dark" /><circle cx="200" cy="390" r="12" class="brand-emerald" /><circle cx="196" cy="386" r="10" class="glow-accent" />
                <path class="brand-emerald" d="M150,240 C146,190 165,110 200,110 C235,110 254,190 250,240 C225,248 175,248 150,240 Z" />
                <path class="glow-accent" d="M150,240 C148,205 165,130 200,110 C200,110 180,135 165,195 C158,215 150,240 150,240 Z" />
                <ellipse cx="200" cy="155" rx="5" ry="12" class="hull-light" opacity="0.35" />
            </g>
        </svg>
    </div>
    <canvas id="smokeCanvas"></canvas>
</div>

<script>
    // ---------- AUDIO ENGINE ----------
    let audioCtx = null, engineRumbleGain = null, crackleThrustGain = null, lowPassFilterNode = null, highPassFilterNode = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playBeep(freq, type, duration, vol) { try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = type || 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } catch(e){} }
    function speakNumber(text) { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.rate = 1.05; window.speechSynthesis.speak(utterance); } }
    function playRocketEngineSound() { initAudio(); const sampleRate = audioCtx.sampleRate, bufferSize = 2 * sampleRate; const brownBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate), brownData = brownBuffer.getChannelData(0); let lastOut = 0; for (let i = 0; i < bufferSize; i++) { const white = Math.random() * 2 - 1; brownData[i] = (lastOut + (0.02 * white)) / 1.02; lastOut = brownData[i]; brownData[i] *= 5.5; } const whiteBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate), whiteData = whiteBuffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) whiteData[i] = (Math.random() * 2 - 1) * (Math.random() > 0.88 ? 1.4 : 0.2); const brownSource = audioCtx.createBufferSource(); brownSource.buffer = brownBuffer; brownSource.loop = true; lowPassFilterNode = audioCtx.createBiquadFilter(); lowPassFilterNode.type = 'lowpass'; lowPassFilterNode.frequency.value = 110; engineRumbleGain = audioCtx.createGain(); engineRumbleGain.gain.value = 0.05; engineRumbleGain.gain.linearRampToValueAtTime(3.5, audioCtx.currentTime + 3); brownSource.connect(lowPassFilterNode); lowPassFilterNode.connect(engineRumbleGain); engineRumbleGain.connect(audioCtx.destination); brownSource.start(); const whiteSource = audioCtx.createBufferSource(); whiteSource.buffer = whiteBuffer; whiteSource.loop = true; highPassFilterNode = audioCtx.createBiquadFilter(); highPassFilterNode.type = 'bandpass'; highPassFilterNode.frequency.value = 180; highPassFilterNode.Q.value = 2; crackleThrustGain = audioCtx.createGain(); crackleThrustGain.gain.value = 0.01; crackleThrustGain.gain.linearRampToValueAtTime(2.8, audioCtx.currentTime + 2.8); whiteSource.connect(highPassFilterNode); highPassFilterNode.connect(crackleThrustGain); crackleThrustGain.connect(audioCtx.destination); whiteSource.start(); }
    function fadeOutRocketSound() { if (audioCtx) { if(engineRumbleGain) engineRumbleGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); if(crackleThrustGain) crackleThrustGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); } }

    // ---------- COUNTDOWN LOGIC ----------
    const targetDate = new Date('May 31, 2026 11:11:00').getTime();
    let standardInterval, isOverridden = false, launchStarted = false;
    let currentShake = 0, smokeSpeedMult = 1, warpSpeed = 0.5;
    
    function updateStandardHUD() {
        if (isOverridden) return;
        const dist = targetDate - Date.now();
        if (dist < 0) {
            document.getElementById('hud-days').innerHTML='00'; document.getElementById('hud-hours').innerHTML='00';
            document.getElementById('hud-mins').innerHTML='00'; document.getElementById('hud-secs').innerHTML='00';
            clearInterval(standardInterval);
            executeLaunch();
            return;
        }
        const days = Math.floor(dist / 86400000), hours = Math.floor((dist % 86400000) / 3600000), mins = Math.floor((dist % 3600000) / 60000), secs = Math.floor((dist % 60000) / 1000);
        document.getElementById('hud-days').innerHTML = String(days).padStart(2,'0');
        document.getElementById('hud-hours').innerHTML = String(hours).padStart(2,'0');
        document.getElementById('hud-mins').innerHTML = String(mins).padStart(2,'0');
        document.getElementById('hud-secs').innerHTML = String(secs).padStart(2,'0');
    }
    standardInterval = setInterval(updateStandardHUD, 1000);
    updateStandardHUD();

    // Starfield
    const spaceCanvas = document.getElementById('spaceCanvas'), sCtx = spaceCanvas.getContext('2d'); let stars = [];
    function resizeSpace(){ spaceCanvas.width = window.innerWidth; spaceCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeSpace); resizeSpace();
    for(let i=0;i<180;i++) stars.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, size: Math.random()*1.8+0.3, speed: Math.random()*0.6+0.1 });
    function drawStars(){ sCtx.clearRect(0,0,spaceCanvas.width,spaceCanvas.height); sCtx.fillStyle="rgba(255,255,255,0.8)"; for(let s of stars){ sCtx.beginPath(); sCtx.arc(s.x,s.y,s.size,0,Math.PI*2); sCtx.fill(); s.y += s.speed * warpSpeed; if(s.y > spaceCanvas.height){ s.y = 0; s.x = Math.random()*spaceCanvas.width; } } requestAnimationFrame(drawStars); }
    drawStars();

    let tlIdle = new TimelineMax({ repeat: -1 }); tlIdle.set("#rocket-image", { transformOrigin: "50% 80%" }).fromTo("#rocket-image", 0.2, { x: -0.5, y: -0.2 }, { x: 0.5, y: 0.2, repeat: -1, yoyo: true });

    // Smoke & Physics - SHAKE AND SOUND START AT 0, THEN SLOW LIFTOFF
    const smokeCanvas = document.getElementById('smokeCanvas'), ctx = smokeCanvas.getContext('2d'); let smokeParticles = [], fireParticles = [];
    function resizeSmoke(){ smokeCanvas.width = window.innerWidth; smokeCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeSmoke); resizeSmoke();
    class Particle { constructor(x,y,type){ this.type=type; this.x=x+(Math.random()*40-20); this.y=y+(Math.random()*12-6); if(type==='fire'){ this.rad=Math.random()*20+15; this.maxRad=Math.random()*60+40; this.vx=Math.random()*4-2; this.vy=Math.random()*8+8; this.baseColor=Math.random()>0.4?'rgba(16,185,129,':'rgba(234,179,8,'; this.alpha=0.9; this.growth=1.5; this.fade=0.018; } else { this.rad=Math.random()*15+10; this.maxRad=Math.random()*280+150; this.vx=Math.random()*14-7; this.vy=Math.random()*-2-1; this.baseColor=['rgba(248,250,252,','rgba(203,213,225,','rgba(16,185,129,','rgba(15,23,42,'][Math.floor(Math.random()*4)]; this.alpha=0.6; this.growth=3.5; this.fade=0.0025; } }
        update(){ this.x+=this.vx*smokeSpeedMult; this.y+=this.vy*smokeSpeedMult; if(this.rad<this.maxRad) this.rad+=this.growth*smokeSpeedMult; this.alpha-=this.fade*smokeSpeedMult; }
        draw(){ ctx.beginPath(); let grad=ctx.createRadialGradient(this.x,this.y,this.rad*0.1,this.x,this.y,this.rad); grad.addColorStop(0,this.baseColor+this.alpha+')'); grad.addColorStop(0.3,this.baseColor+(this.alpha*0.5)+')'); grad.addColorStop(1,this.baseColor+'0)'); ctx.fillStyle=grad; ctx.arc(this.x,this.y,this.rad,0,Math.PI*2); ctx.fill(); }
    }
    let stageAnchor = document.getElementById('stageAnchor'), controlsUIelem = document.getElementById('controlsUI'), masterScene = document.getElementById('scene'), flashOverlay = document.getElementById('portalFlash');
    let velocityY=0, accelerationY=0.08, currentBottom=40, animationTriggered=false, launchSequenceStarted=false;
    let engineSoundStarted = false;
    
    function animateFX() { ctx.clearRect(0,0,smokeCanvas.width,smokeCanvas.height); const rect = stageAnchor.getBoundingClientRect(); const nozzleX = rect.left+rect.width/2, nozzleY = rect.bottom-25; if(launchStarted && rect.bottom > -200){ for(let i=0;i<6;i++) fireParticles.push(new Particle(nozzleX,nozzleY,'fire')); for(let i=0;i<10;i++) smokeParticles.push(new Particle(nozzleX,nozzleY,'smoke')); if(currentShake>0){ let shakeX=(Math.random()-0.5)*currentShake, shakeY=(Math.random()-0.5)*currentShake; masterScene.style.transform=`translate(${shakeX}px, ${shakeY}px)`; } }
        if(launchStarted && launchSequenceStarted){ 
            velocityY += accelerationY; 
            accelerationY += 0.025;
            currentBottom += velocityY; 
            stageAnchor.style.bottom = currentBottom + 'px'; 
            let scale = Math.max(0.1, 1 - (velocityY * 0.0022)); 
            stageAnchor.style.transform = `translateX(-50%) scale(${scale})`; 
        }
        for(let i=smokeParticles.length-1;i>=0;i--) { smokeParticles[i].update(); smokeParticles[i].draw(); if(smokeParticles[i].alpha<=0) smokeParticles.splice(i,1); }
        ctx.globalCompositeOperation='screen'; for(let i=fireParticles.length-1;i>=0;i--) { fireParticles[i].update(); fireParticles[i].draw(); if(fireParticles[i].alpha<=0) fireParticles.splice(i,1); } ctx.globalCompositeOperation='source-over';
        if(launchStarted && launchSequenceStarted && rect.bottom <= -150 && !animationTriggered){ 
            animationTriggered=true; currentShake=0; masterScene.style.transform='translate(0px,0px)'; fadeOutRocketSound(); 
            TweenMax.to(flashOverlay, 1.2, {opacity: 1, ease: Power3.easeIn, onComplete:()=>{ window.location.href='https://www.meenamushroom.com'; } }); 
        }
        requestAnimationFrame(animateFX);
    }
    animateFX();

    // ---------- SECURITY OVERRIDE + SOLO COUNTDOWN (SHAKE + SOUND START AT 0) ----------
    const modal = document.getElementById('secureOverrideModal'), digits = document.querySelectorAll('.passcode-digit'), errorMsg = document.getElementById('errorMessage');
    const standardHUDDiv = document.getElementById('standardHUD');
    const soloContainer = document.getElementById('soloCountdownContainer');
    const soloSecondsSpan = document.getElementById('soloSeconds');

    function toggleLeverTriggered(){ if(launchStarted) return; document.getElementById('switchConsole').classList.add('flipped'); playBeep(180,'triangle',0.15,0.25); setTimeout(()=>{ modal.classList.add('active'); digits[0].focus(); },250); }
    window.stepPasscodeInput = function(input,idx){ playBeep(600,'sine',0.03,0.08); if(input.value.length>1) input.value=input.value.slice(0,1); if(input.value!=="" && idx<3) digits[idx+1].focus(); };
    window.verifyOverrideSequence = function(){ 
        let code = ""; digits.forEach(inp=>code+=inp.value); 
        if(code==="1234"){ 
            playBeep(587,'triangle',0.1,0.1); setTimeout(()=>playBeep(880,'triangle',0.3,0.1),80);
            errorMsg.style.opacity="0"; modal.classList.remove('active'); 
            standardHUDDiv.style.display = 'none';
            soloContainer.style.display = 'flex';
            initiateSoloCountdown();
        } else { 
            playBeep(120,'sawtooth',0.3,0.2); errorMsg.style.opacity="1"; 
            TweenMax.fromTo(".passcode-wrapper",0.05,{x:-10},{x:10,repeat:5,yoyo:true, onComplete:()=>{ digits.forEach(inp=>inp.value=""); digits[0].focus(); document.getElementById('switchConsole').classList.remove('flipped'); } }); 
        } 
    };

    function initiateSoloCountdown() {
        isOverridden = true;
        clearInterval(standardInterval);
        let remaining = 10;
        const updateSolo = () => {
            soloSecondsSpan.innerText = remaining;
            if (remaining === 10) speakNumber("Ten");
            else if (remaining === 9) speakNumber("Nine");
            else if (remaining === 8) speakNumber("Eight");
            else if (remaining === 7) speakNumber("Seven");
            else if (remaining === 6) speakNumber("Six");
            else if (remaining === 5) speakNumber("Five");
            else if (remaining === 4) speakNumber("Four");
            else if (remaining === 3) { speakNumber("Three"); playBeep(493.88,'sine',0.12,0.15); }
            else if (remaining === 2) { speakNumber("Two"); playBeep(493.88,'sine',0.12,0.15); }
            else if (remaining === 1) { 
                speakNumber("One"); 
                playBeep(493.88,'sine',0.12,0.15);
                clearInterval(soloInterval);
                // When countdown reaches 0, start engine sound + intense shake, THEN launch sequence
                startEngineAndShake();
            }
            remaining--;
        };
        updateSolo();
        const soloInterval = setInterval(() => {
            if (remaining < 1) return;
            updateSolo();
        }, 1000);
    }

    function startEngineAndShake() {
        // Activate rocket engine sound (like old concept)
        playRocketEngineSound();
        // Intense screen shake and rocket vibration
        currentShake = 18;
        // Override idle animation with intense vibration
        tlIdle.clear();
        new TimelineMax({repeat:-1}).set("#rocket-image",{transformOrigin:"50% 85%"}).fromTo("#rocket-image",0.02,{x:-12,y:-5},{x:12,y:5,repeat:-1,yoyo:true});
        // After 1.5 seconds of shake/sound, start liftoff
        setTimeout(() => {
            launchStarted = true;
            launchSequenceStarted = true;
            controlsUIelem.style.opacity = '0';
            controlsUIelem.style.transform = 'translateY(-30px)';
            // Gradually increase smoke and warp speed during liftoff
            const speedBoost = setInterval(() => {
                smokeSpeedMult += 0.3;
                warpSpeed += 2;
                if (warpSpeed > 45) clearInterval(speedBoost);
            }, 100);
        }, 1500);
    }

    function executeLaunch() {
        // Fallback for natural countdown reaching 0
        if (launchStarted) return;
        startEngineAndShake();
        setTimeout(() => {
            launchStarted = true;
            launchSequenceStarted = true;
            controlsUIelem.style.opacity = '0';
            controlsUIelem.style.transform = 'translateY(-30px)';
            const speedBoost = setInterval(() => {
                smokeSpeedMult += 0.3;
                warpSpeed += 2;
                if (warpSpeed > 45) clearInterval(speedBoost);
            }, 100);
        }, 1500);
    }
</script>
</body>
</html>
